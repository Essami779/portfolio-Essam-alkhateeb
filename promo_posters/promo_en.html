<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Promo EN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap');
        body {
            margin: 0;
            padding: 0;
            background: #151515;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .container {
            width: 1080px;
            height: 1080px; /* Square Instagram size */
            background: radial-gradient(circle at 30% 30%, #30104a 0%, #151515 60%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 80px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        .blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: #ec1839; /* His site's red accent color */
            filter: blur(150px);
            opacity: 0.3;
            border-radius: 50%;
            top: -100px;
            left: -100px;
            z-index: 1;
        }
        .blob2 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #00ccff; 
            filter: blur(120px);
            opacity: 0.2;
            bottom: -50px;
            right: -50px;
            z-index: 1;
        }
        .text-content {
            z-index: 2;
            max-width: 500px;
        }
        .pre-title {
            color: #ec1839;
            font-size: 28px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .title {
            font-size: 85px;
            font-weight: 800;
            line-height: 1.1;
            margin: 0 0 20px 0;
            background: linear-gradient(90deg, #fff, #bbb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 28px;
            color: #aaa;
            margin-bottom: 40px;
        }
        .brand {
            font-size: 24px;
            font-weight: 700;
            border-top: 2px solid rgba(255,255,255,0.1);
            padding-top: 20px;
            color: #ccc;
        }
        .brand span {
            color: #ec1839;
        }
        .photo-container {
            z-index: 2;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            padding: 10px;
            background: linear-gradient(45deg, #ec1839, #00ccff);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }
        .photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #151515;
            object-position: top center;
        }
        .tag {
            position: absolute;
            bottom: 30px;
            left: -20px;
            background: #fff;
            color: #000;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 24px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transform: rotate(-5deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="blob"></div>
        <div class="blob2"></div>

        <div class="text-content">
            <div class="pre-title">Eng. Essam Alkhateeb</div>
            <h1 class="title">COMING<br>SOON</h1>
            <div class="subtitle">We are working on something very special. Stay tuned!</div>
            <div class="brand"><span>&lt;/&gt;</span> Web Developer | UI/UX & App Designer</div>
        </div>

        <div class="photo-container">
            <!-- Path to your photo -->
            <img src="../images/Essam Alkhateeb.png" alt="Essam Alkhateeb" class="photo" style="transform: scaleX(-1);">
            <div class="tag">SOON</div>
        </div>
    </div>
</body>
</html>
